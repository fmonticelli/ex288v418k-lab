# E3: pipeline com dois defeitos propositais (corrigir sem recriar o projeto):
#  1) read nao declara runAfter: write (ordem nao garantida)
#  2) read tenta ler um arquivo com nome incorreto (falha em runtime)
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: broken-ci
  labels: {ex288-lab: v3}
spec:
  workspaces:
    - name: shared
  tasks:
    - name: write
      workspaces:
        - {name: data, workspace: shared}
      taskSpec:
        workspaces:
          - name: data
        steps:
          - name: w
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/sh
              echo "ok" > $(workspaces.data.path)/result.txt
    - name: read
      workspaces:
        - {name: dados, workspace: shared}
      taskSpec:
        workspaces:
          - name: dados
        steps:
          - name: r
            image: registry.access.redhat.com/ubi9/ubi-minimal:latest
            script: |
              #!/bin/sh
              cat $(workspaces.dados.path)/resultado.txt
