<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EX288 Exam Simulator</title>
<style>
:root{font:16px system-ui,sans-serif;color:#e6e8ed;background:#10151d}*{box-sizing:border-box}body{margin:0}header{padding:16px 24px;border-bottom:1px solid #354052;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:1.15rem;margin:0}button,select{font:inherit;padding:9px 13px;border-radius:6px;border:1px solid #64748b;background:#233045;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button.primary{background:#1865b8;border-color:#408ee2}button.danger{background:#813438}main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 70px)}aside{padding:18px;border-right:1px solid #354052}aside button{width:100%;text-align:left;margin-bottom:8px}article{padding:24px;max-width:1050px;width:100%}.muted{color:#aeb9c9}.panel{background:#19222e;border:1px solid #36465b;border-radius:10px;padding:18px;margin:14px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.spaced{justify-content:space-between}.item{border-top:1px solid #36465b;padding:14px 0}label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}input[type=checkbox]{width:18px;height:18px;flex-shrink:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1219;padding:14px;border-radius:6px;line-height:1.6}#result{max-height:480px;overflow:auto}#clock{font-variant-numeric:tabular-nums;font-size:1.4rem}#progress{height:8px;background:#344052;border-radius:5px;overflow:hidden}#bar{height:100%;width:0;background:#4ca6e8}a{color:#8dc5ff}#question{line-height:1.65}#question h2{margin-top:25px}#question code{background:#29384b;padding:2px 5px;border-radius:4px}#question ul{padding-left:24px}#question blockquote{border-left:3px solid #667e9b;padding-left:14px;color:#c6d2e2}@media(max-width:760px){main{display:block}aside{border-right:0;border-bottom:1px solid #354052}article{padding:14px}}
</style></head><body>
<header><h1>EX288 · Exam Simulator</h1><div class="row"><span id="clock">00:00:00</span><button id="reset">Reiniciar relógio</button></div></header>
<main><aside><div class="row"><label for="mode">Modo</label><select id="mode"><option value="exam">Simulado completo</option><option value="task">Treino por tarefa</option></select><select id="variant"><option>A</option><option>B</option></select></div><p class="muted" id="subtitle"></p><nav id="nav"></nav><div id="progress"><div id="bar"></div></div><p class="muted" id="count"></p></aside>
<article><div class="row spaced"><h2 id="title">Carregando...</h2><div class="row"><button id="prepare">Preparar ambiente</button><button class="primary" id="validate">Validar resultado</button></div></div>
<p class="muted">Checkboxes são apenas anotações. A correção consulta os recursos reais no OpenShift e não depende do método utilizado (CLI, console ou YAML).</p>
<section class="panel" id="question"></section><section class="panel"><h3>Checklist pessoal</h3><div id="checks"></div></section>
<section class="panel" id="results" hidden><h3>Resultado da validação</h3><p id="status"></p><pre id="result"></pre></section>
</article></main><script src="/app.js"></script></body></html>
